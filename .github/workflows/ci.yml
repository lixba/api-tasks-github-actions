name: Continuous Integration

on: 
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env: 
  DOTNET_VERSION: '10.0.103'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build:
    name: "CI"
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
        
      - name: test 
        run: dotnet test --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Dotnet publish
        run: dotnet publish src/TaskApi/TaskApi.csproj --configuration ${{ env.BUILD_CONFIGURATION }} -o artifacts

      - name : Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uv-artifacts
          path: artifacts/

  deploy_dev: 
    name: "Deploy to dev"
    runs-on: ubuntu-latest
    needs: build # espera que se ejecute primero el CI

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: uv-artifacts
          path: artifacts/

      - name: Login Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENTE_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy en Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: app-api-uv-lixba-dev
          package: artifacts/