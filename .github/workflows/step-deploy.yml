name: Step deploy

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
        
    secrets:
      AZURE_CLIENTE_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_TENANT_ID:
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.env }}
    runs-on: ubuntu-latest      
    environment: ${{ inputs.env }}       

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: uv-artifacts
          path: artifacts/

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{secrets.AZURE_CLIENTE_ID}}
          tenant-id: ${{secrets.AZURE_TENANT_ID}}
          subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}

      - name: Deploy to Azure Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: app-api-uv-lixba-${{inputs.env}}
          package: artifacts/